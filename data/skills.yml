- name: 🐍 Languages
  content:
    - name: Python
      icon:
        fa: fab fa-python
        mn: python
      cert: https://www.testdome.com/cert/4e8bba06a5c1430aa6a15b799ee39933
      info: >
        This is my favorite language, I've been in it since version 3.4 (2014).
        I know the source code of almost all stdlib, have many Python-based
        Open Source [projects](./projects.html) and public talks, always
        can pick the best library for any task.
    - name: Go
      icon:
        fa: fas fa-running
        # mn: go
      cert: https://www.testdome.com/cert/ca9b6d75b87c4be9bda30a00b68c70b7
      info: >
        I'm quite proficient with Go. I reach to it when I need a good performance:
        games, small systems (thanks to TinyGo), CLI tools, and small but important APIs.
        Oh, and of course I have [some open-source projects](./projects.html) on Go.
        I work with Go since version 1.11 (2018).
    - name: Elixir
      icon:
        fa: fas fa-flask
      info: >
        I enjoy Elixir and believe it's the best functional language.
        I know some good of chunk of Erlang, have experience with a basic web app on
        Phoenix with LiveView, understand Erlang concurrency, know some parts of OTP,
        and eager to dive deeper into this beautiful ecosystem.
    - name: HTML & CSS
      cert: https://app.testdome.com/cert/9d8039b38e384002805977ef3a220ec4
      icon:
        fa: fab fa-html5
        mn: html-five
      info: >
        I'm pretty fluent with HTML, CSS, and even the quirks of WebAPI.
        I might miss some modern features like flexbox, though.
        Mostly, because Bootstrap is sufficient for my projects and it
        abstracts away some markup complexity.
    - name: Frontend (JS)
      cert: https://app.testdome.com/cert/9d8039b38e384002805977ef3a220ec4
      icon:
        fa: fab fa-js
      info: >
        With modern JS I'm less familiar.
        Mostly, I use for my projects AlpineJS, WASM, and LiveView.
        If you need a frontend developer, it's not me. But if you need from me just
        a good understanding of your frontend, I can easily crack it.
    - name: More!
      info: >
        I believe that every programming language has some beautiful ideas,
        and I like learning new ones. I have experience with Rust, Haskell, Gleam,
        Idris, RPython, Pony, Nim, Crystal, Clojure, Scala, JS, Ruby, and many other
        languages. I'm not afraid to read and fix code written in any language.

- name: 🧠 Hard skills
  content:
    - name: Distributed Systems
      icon:
        fa: fas fa-network-wired
      info: >
        Distributed systems are hard because of the very nature of our world
        (damn you, speed of light!), and I enjoy cracking this complexity.
        I'm familiar with fundamental problems, design patterns, algorithms,
        formal verification techniques and tools (TLA+ and Alloy 6),
        and just in general can design reliable solutions and consider
        all possible corner cases.
    - name: Quality Assurance
      cert: https://app.testdome.com/cert/54d8c8c8957f43fe9b9f0f505c9cf479
      icon:
        fa: fas fa-check-double
      info: >
        Automated testing (unit, integration, acceptance, regression),
        static code analysis, formal verification,
        contract programming, mutation tests, and type theory.
        I like to push the boundaries of my code to see how it performs in extreme
        situations, to find interesting corner cases, and to dive into the math behind programming.
    - name: Security
      cert: https://app.testdome.com/cert/95979e76c01f42c6afd8305f89d0af3d
      icon:
        fa: fas fa-shield-alt
      info: >
        I have an Information Security red diploma,
        interested in practical aspects of security,
        have many publications on different topics,
        visited some security conferences.
        I was a founder and leader of the CTF team that has gotten
        6th place in an [international contest](https://ctftime.org/event/360)
        ([alert1](https://ctftime.org/team/24077) team).
        In the Smena team I've made global security audit, fixed many security issues,
        integrated some security systems like
        [brute force protection](https://github.com/orsinium/django-bruteforce-protection)
        and intrusion detection.
    - name: DS and ML
      icon:
        fa: fas fa-robot
      info: >
        At the university, I worked in the linguistics department
        where I researched language and text influence,
        adopted Claude Shannon's information theory to natural languages.
        In Cindicator I wrote simple trading strategies that get
        information from crypto exchanges and make predictions
        about cryptocurrencies prices. In my free time I learn
        Machine Learning and build different cool models.
        See [my projects](projects.html#ds-and-ml) for examples.
    - name: Software Architecture
      icon:
        fa: fas fa-diagram-project
      info: >
        I know design patterns, antipatterns, refactoring techniques, 12 factors, SOLID principles.
        In Cindicator, I was the architect for the trading platform
        from the first lines of code to the successful launch.
    - name: Linux
      icon:
        fa: fab fa-linux
        mn: linux
      cert: https://www.testdome.com/cert/eb426eb5ffe243bab4e78c92c31e531f
      info: >
        I live in Linux for 8 years and can solve any issue from a terminal.
        I've worked with different Linux distros (Ubuntu, Debian, CentOS),
        set up physical servers, VPS, Raspberry Pi, Orange Pi.
    - name: Logic
      icon:
        fa: fas fa-brain
      cert: https://www.testdome.com/cert/f0bb94fe82444fc99660bbbe022ae974
      info: >
        I'm familiar with formal logic basics, boolean logic,
        math logic, a little bit with proof theory.
        [deal](https://github.com/life4/deal) is my experiment
        on how good you can prove code automatically,
        without writing proofs at all.
    - name: Math
      icon:
        fa: fas fa-calculator
      cert: https://www.testdome.com/cert/1eb189d7b92c4390941822ecf2e38ea9
      info: >
        I <i class="far fa-heart"></i> math! I watch Numberphile,
        solve riddles and equations for fun, know how to apply
        math in my work to make code faster and even nicer.
